[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BINARY_CONTENT_TYPES = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream,application/zip"

[functions]
  node_bundler = "esbuild"
  # Tell Netlify to treat these as binary so buffers are not corrupted
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
